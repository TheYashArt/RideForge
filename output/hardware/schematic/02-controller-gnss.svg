<text x="1088" y="861" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#202c36" text-anchor="start" font-weight="normal">Fit close to U4; check breakout parts before duplicating.</text>
<text x="48" y="898" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#202c36" text-anchor="start" font-weight="normal">U4 unused pads: 5 EXTINT, 6 V_BCKP, 9 RESET_N, 13 LNA_EN, 14 VCC_RF, 15 VIO_SEL, 16 SDA, 17 SCL, 18 SAFEBOOT_N: NC.</text>
<text x="48" y="924" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#202c36" text-anchor="start" font-weight="normal">VIO_SEL open = 3.3 V I/O. Passive antenna baseline; an active antenna needs its verified bias supply circuit.</text>
<rect x="48" y="932" width="1504" height="122" fill="#fffaf3" stroke="#a85b0b" stroke-width="1.4"/>
<text x="64" y="960" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a85b0b" text-anchor="start" font-weight="bold">Alternate J3 / breakout interface + power sequencing</text>
<text x="64" y="987" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#202c36" text-anchor="start" font-weight="normal">J3: 1 V3V3_SYS / 2 GND_STAR / 3 GPS_TX / 4 GPS_RX / 5 GPS_PPS optional. These are proposed carrier-connector pins.</text>
<text x="64" y="1012" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#202c36" text-anchor="start" font-weight="normal">Use U4 raw module OR J3 breakout; do not populate both. Breakout header order and voltage must be verified separately.</text>
<text x="64" y="1037" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#202c36" text-anchor="start" font-weight="normal">Do not drive GNSS inputs while V_IO is off. PPS must stay high impedance at startup. Verify USB and separate-rail sequencing.</text>
<line x1="48" y1="1060" x2="1552" y2="1060" stroke="#202c36" stroke-width="1"/>
<text x="48" y="1086" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#202c36" text-anchor="start" font-weight="normal">Basis: pcb.md + pcb-components.md | 06 Oct 2026 | Amber = unresolved selection / validation</text>
<text x="48" y="1110" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#a85b0b" text-anchor="start" font-weight="normal">Schematic review drawing. No CAD ERC, physical-board verification, vehicle testing or fabrication release.</text>
