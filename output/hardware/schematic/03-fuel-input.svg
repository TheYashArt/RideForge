<text x="64" y="987" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#202c36" text-anchor="start" font-weight="normal">D2/D3 parts, leakage over temperature and pulse ratings are TBD. Upper clamp and op-amp input diodes can back-power 3V3.</text>
<text x="64" y="1012" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#202c36" text-anchor="start" font-weight="normal">The divider is not a completed automotive surge/power-off design. Resolve rail-current handling or isolation before bike use.</text>
<text x="64" y="1037" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#202c36" text-anchor="start" font-weight="normal">Measure the actual signal and ground reference with the factory gauge connected. ADC attenuation/calibration must suit this range.</text>
